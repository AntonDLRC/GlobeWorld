{% extends "layout.html" %}

{% block body %}
<!-- title content -->
    <header class="header">
        <h1 class="title">GlobeWorld</h1>
        <p class="subtitle">Click any country | <br>
            Drag to rotate
        </p>
    </header>

<!-- globe container (rest of code is in javascript) -->
    <div id="globe-container"></div>

<!-- Popup container-->
 <div id="popup" class="popup">

    <!-- × close button (&times; = the × symbol in HTML) -->
    <button id="popup-close" aria-label="Close">&times;</button>


    <!-- LOADING STATE: spinner shown while fetching -->
    <div id="popup-loading" class="popup-loading">
        <div class="spinner"></div>
        <span>Loading…</span>
    </div>


    <!-- ERROR STATE: shown if data could not be loaded -->
    <div id="popup-error" class="popup-loading">
        <span style="color: #f87171;">⚠ Could not load data</span>
        <small id="popup-error-msg"
               style="color: rgba(248,113,113,0.6); margin-top: 6px; display: block;">
        </small>
    </div>


    <!-- CONTENT STATE: the actual country information -->
    <div id="popup-content" class="popup-content">

        <!-- Country flag and name (filled by home.js) -->
        <div class="popup-header">
            <img id="popup-flag" src="" alt="" />
            <div class="popup-title-group">
                <h2 id="popup-name"></h2>
                <p  id="popup-official" class="popup-official"></p>
                <span id="popup-region-badge" class="region-badge"></span>
            </div>
        </div>

        <!-- Info grid — each block is one fact about the country -->
        <div class="popup-stats">

            <div class="stat-item">
                <span class="stat-label">Capital</span>
                <span class="stat-value" id="popup-capital"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="popup-population"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Area</span>
                <span class="stat-value" id="popup-area"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Currency</span>
                <span class="stat-value" id="popup-currency"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Languages</span>
                <span class="stat-value" id="popup-languages"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Calling code</span>
                <span class="stat-value" id="popup-calling"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Timezone</span>
                <span class="stat-value" id="popup-timezone"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">UN Status</span>
                <span class="stat-value" id="popup-un"></span>
            </div>

        </div>


    </div>

</div>

<!-- loaded from the internet -->
<script src="https://unpkg.com/globe.gl"></script>
<script src="{{ url_for('static', filename='home.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

{% endblock %}
