{% extends "layout.html" %}

{% block body %}

<a href="/map" class="switch-btn switch-btn-left">Map</a>
<a href="/quiz" class="switch-btn switch-btn-right">Quiz</a>

<!-- title content -->
    <header class="header">
        <h1 class="title">GlobeWorld</h1>
    </header>

<!-- globe container (rest of code is in javascript) -->
    <div id="globe-container"></div>

<!-- Popup container-->
 <div id="popup" class="popup">

    <!-- × close button (&times; = the × symbol in HTML) -->
    <button id="popup-close" aria-label="Close">&times;</button>


    <!-- CONTENT STATE: the actual country information -->
    <div id="popup-content" class="popup-content">

        <!-- Country flag and name (filled by home.js) -->
        <div class="popup-header">
            <img id="popup-flag" src="" alt="" />
            <div class="popup-title-group">
                <h2 id="popup-name"></h2>
                <p  id="popup-official" class="popup-official"></p>
                <span id="popup-region-badge" class="region-badge"></span>
            </div>
        </div>

        <!-- Info grid — each block is one fact about the country -->
        <div class="popup-stats">

            <div class="stat-item">
                <span class="stat-label">Capital</span>
                <span class="stat-value" id="popup-capital"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="popup-population"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Area</span>
                <span class="stat-value" id="popup-area"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Currency</span>
                <span class="stat-value" id="popup-currency"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Languages</span>
                <span class="stat-value" id="popup-languages"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Calling code</span>
                <span class="stat-value" id="popup-calling"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">Timezone</span>
                <span class="stat-value" id="popup-timezone"></span>
            </div>

            <div class="stat-item">
                <span class="stat-label">UN Status</span>
                <span class="stat-value" id="popup-un"></span>
            </div>

            <!-- Places to visit — full width row -->
            <div class="stat-item" style="grid-column: 1 / -1;">
               <span class="stat-label">Popular Places</span>
              <span class="stat-value" id="popup-places"></span>
            </div>

        </div>

        <!-- History text — comes from your database via Flask -->
        <div class="popup-description">
            <p class="desc-heading">History</p>
            <p id="popup-desc-text"></p>
        </div>

    </div>

</div>

<!-- Create a search bar  -->
<div class="search-bar">

    <div class="search-box">
        <select id="region-filter">
        <option value="all">All Regions</option>
        <option value="Africa">Africa</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
    </select>

        <!-- Text box where user types -->
        <input
            id="search-input"
            type="text"
            placeholder="Search a country…"
            autocomplete="off"
            spellcheck="false"
        />

        <!-- Magnifying glass button -->
        <button id="search-btn" aria-label="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>

    </div>

    <!-- The suggestion dropdown — starts empty.
         home.js fills it with country names as you type. -->
    <ul id="search-dropdown" class="search-dropdown"></ul>

</div>

<!-- loaded from the internet -->
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="{{ url_for('static', filename='home.js') }}"></script>

{% endblock %}
